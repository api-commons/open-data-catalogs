overlay: 1.0.0
info:
  title: Open Data Catalogs -- dcat-us-1.1 alignment
  version: 0.1.0-draft.20261111
  description: Marks the common Open Data Catalogs OpenAPI with the dcat-us-1.1 object each schema corresponds to, and the
    field each property maps to. Generated by scripts/overlay.py from standards/dcat-us-1.1.yml; nothing is renamed.
extends: openapi.yml
actions:
- target: $.components.schemas.Dataset
  update:
    x-commons-standard:
      standard: dcat-us-1.1
      source: https://github.com/project-open-data/project-open-data.github.io/tree/master/v1.1/schema
      objects:
      - dataset
      core_coverage: 1.0
      fields:
        access_level: accessLevel
        license: rights
        accrual_periodicity: accrualPeriodicity
        contact_point: contactPoint
        conforms_to: conformsTo
        description: description
        distributions: distribution
        id: identifier
        created_at: issued
        keywords: keyword
        updated_at: modified
        publisher_id: publisher
        spatial: spatial
        temporal: temporal
        name: title
      standard_only:
      - bureauCode
      - describedBy
      - describedByType
      - dataQuality
      - landingPage
      - language
      - primaryITInvestmentUII
      - programCode
      - references
      - systemOfRecords
      - isPartOf
